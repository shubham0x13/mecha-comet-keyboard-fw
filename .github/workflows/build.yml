name: Build

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Fetch build matrix
    outputs:
      build_matrix: ${{ steps.fetch.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The version is the USB device release number in binary-coded
          # decimal, MM.m.p: v0.1.0 is 0x0010 and v1.2.3 is 0x0123.
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]{1,2})\.([0-9])\.([0-9])(-.+)?$ ]]; then
            echo "::error::The tag ${GITHUB_REF_NAME} must look like v0.1.0 or v12.3.4-rc1"
            exit 1
          fi
          expected="CONFIG_USB_DEVICE_BCD_DEVICE=$(printf '0x%02d%d%d' "$((10#${BASH_REMATCH[1]}))" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")"
          if [[ "$(grep '^CONFIG_USB_DEVICE_BCD_DEVICE=' config/mecha_comet_keyboard.conf | tail -n 1)" != "${expected}" ]]; then
            echo "::error::The tag ${GITHUB_REF_NAME} needs ${expected} in config/mecha_comet_keyboard.conf"
            exit 1
          fi

      - name: Fetch build matrix
        id: fetch
        run: |
          matrix="$(yq -oj -I0 build.yaml)"
          echo "build_matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: zmkfirmware/zmk-build-arm:4.1
    needs: matrix
    name: Build ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    env:
      REPO_DIR: mecha-comet-keyboard-fw
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.REPO_DIR }}
          persist-credentials: false

      - name: Cache west modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-west-${{ hashFiles('**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      - name: West init and update
        run: |
          west init -l "${REPO_DIR}"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Apply patches
        run: |
          west patch clean
          west patch apply

      - name: West build
        env:
          BOARD: ${{ matrix.board }}
          SNIPPET: ${{ matrix.snippet }}
          KEYMAP: ${{ matrix.keymap }}
          CMAKE_ARGS: ${{ matrix.cmake-args }}
        run: |
          config_dir="${GITHUB_WORKSPACE}/${REPO_DIR}/config"
          west build -s zmk/app -d build -b "${BOARD}" ${SNIPPET:+-S "${SNIPPET}"} -- \
            -DZMK_CONFIG="${config_dir}" \
            ${KEYMAP:+-DKEYMAP_FILE="${config_dir}/mecha_comet_keyboard_${KEYMAP}.keymap"} \
            ${CMAKE_ARGS}

      - name: Kconfig file
        if: ${{ !cancelled() }}
        run: grep -v -e "^#" -e "^$" build/zephyr/.config | sort || echo "No Kconfig output"

      - name: Devicetree file
        if: ${{ !cancelled() }}
        run: cat build/zephyr/zephyr.dts || echo "No Devicetree output"

      - name: Rename artifact
        run: |
          mkdir artifacts
          cp build/zephyr/zmk.bin "artifacts/${{ matrix.artifact-name }}.bin"

      - name: Archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-${{ matrix.artifact-name }}
          path: artifacts

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    name: Create draft release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-*
          merge-multiple: true
          path: firmware

      - name: Create draft release
        run: |
          cd firmware
          for f in *.bin; do mv -- "$f" "${f%.bin}-${GITHUB_REF_NAME}.bin"; done
          sha256sum -- * > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes -- *
