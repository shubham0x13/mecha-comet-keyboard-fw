# Prints the stack use of every thread and of the interrupt stack on the UART
# every 5 seconds, to size the stacks. Use it with a ZMK Studio build, and keep it
# out of releases. The Cortex-M0+ has no MPU, so a stack that is too small
# corrupts memory without a fault: the sentinel catches that during the tests.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y

CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
