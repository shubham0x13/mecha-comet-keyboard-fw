CONFIG_ZMK_POINTING=y

# RGB start-up state, until changes made with the &rgb_ug keys are saved.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2

# Wait this long after the last change before saving settings, in milliseconds.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Hold-tap keys held and key events captured, tap-dance keys and sticky keys
# that can be undecided or active at the same time.

# CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=4
# CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=16
# CONFIG_ZMK_BEHAVIOR_TAP_DANCE_MAX_HELD=2
# CONFIG_ZMK_BEHAVIOR_STICKY_KEY_MAX_HELD=3

# You only ever hold at most 1-2 hold-taps (e.g. Space-Shift + key) with thumbs
# Default: 4  (Saves ~176 B)
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=2
# Default: 16 (Saves ~320 B)
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=8

# You cannot tap-dance two separate keys simultaneously with 2 thumbs
# Default: 2  (Saves ~88 B)
CONFIG_ZMK_BEHAVIOR_TAP_DANCE_MAX_HELD=1

# At most 1-2 sticky modifiers active at once
# Default: 3  (Saves ~80 B)
CONFIG_ZMK_BEHAVIOR_STICKY_KEY_MAX_HELD=2

# You cannot physically press 2 separate multi-key combos at the exact same moment
# Default: 4  (Saves ~216 B)
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=1

# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
# CONFIG_ISR_STACK_SIZE=1024

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=16
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512

# Saves ~384 B
# CONFIG_ADC_ADS1X1X_ACQUISITION_THREAD_STACK_SIZE=640
# Saves ~256 B
# CONFIG_INPUT_MECHA_PIVOT_PIP_THREAD_STACK_SIZE=512
