# Firmware version, as the USB device release number in binary-coded decimal,
# MM.m.p: 0.1.0 is 0x0010 and 1.2.3 is 0x0123. Write it as 0x and four digits, and
# keep it equal to the release tag.
CONFIG_USB_DEVICE_BCD_DEVICE=0x0010

CONFIG_ZMK_POINTING=y

# RGB start-up state, until changes made with the &rgb_ug keys are saved.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2

# Wait this long after the last change before saving settings, in milliseconds.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Hold-tap keys held and key events captured, tap-dance keys and sticky keys
# that can be undecided or active at the same time.
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=4
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=16
CONFIG_ZMK_BEHAVIOR_TAP_DANCE_MAX_HELD=2
CONFIG_ZMK_BEHAVIOR_STICKY_KEY_MAX_HELD=3

# TODO: smaller stacks so the Studio build fits in RAM. Check the stack usage
# on hardware when the RAM is optimized.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_ISR_STACK_SIZE=1024
