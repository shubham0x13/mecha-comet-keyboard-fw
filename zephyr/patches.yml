# Applied with "west patch apply" after "west update".
# After editing a patch file, update its sha256sum here.
# Run "west patch clean" before removing the last patch of a module, as it only
# cleans the modules that are listed here.
patches:
  - path: zephyr/0001-soc-nxp-mcxc-add-MCXC243-SoC-support.patch
    sha256sum: 9823055bcc7f2c5d5f81e8d71ff1aed3c6da5ec9bc03aa88c438bc1bb10b590a
    module: zephyr
    author: Shubham Patel
    email: shubham0x13@gmail.com
    date: 2026-10-19
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/121888
    merge-status: true
    merge-commit: 0b07590b00ea4e0bd7a5bc5045e82c39a8f1823e
    merge-date: 2026-10-29
    apply-command: git apply
    comments: |
      Backport of upstream PR 121888 (MCXC243 SoC support, merged in Zephyr main
      as 0b07590b00ea) to the ZMK Zephyr 4.1 fork. There the dtsi is in
      dts/arm/nxp/, not in mcx/mcxc/, and there is no crc node to delete.
      Drop when the Zephyr of ZMK contains 0b07590b00ea. Zephyr 4.5.0 does not,
      so that needs a later release. The hal_nxp patch goes at the same time.

  - path: zephyr/0002-adc-ads1x1x-support-several-channels.patch
    sha256sum: 3582c62b6f27253ef51a5b6ff0c5cd1f56a691e4f4cd2c2f683ddc31409599e5
    module: zephyr
    author: Shubham Patel
    email: shubham0x13@gmail.com
    date: 2026-10-22
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/122444
    merge-status: false
    apply-command: git apply
    comments: |
      Backport of upstream PR 122444 (ADS1x1x: support several channels, still
      open) to the ZMK Zephyr 4.1 fork. Needed to read the X and Y axes of the
      pointing stick on AIN0 and AIN1. Keeps two differences of the 4.1 fork:
      the input multiplexer block is not wrapped in
      ADC_ADS1X1X_CONFIGURABLE_INPUTS, and chips without a multiplexer still
      check for the differential 0 and 1 pair.
      Drop when the Zephyr of ZMK contains the PR. Update merge-status when it
      is merged.

  - path: zephyr/0003-usb-device-add-a-bcdDevice-option.patch
    sha256sum: 46033c8bf1e8013d74016b8465026e990b3cb54decdcba49129de4f802cab2a3
    module: zephyr
    author: Shubham Patel
    email: shubhamp@ext.mechasystems.com
    date: 2026-10-30
    upstreamable: false
    apply-command: git apply
    comments: |
      Lets the keyboard report its firmware version (MM.m.p in BCD) as the USB
      device release number, set with CONFIG_USB_DEVICE_BCD_DEVICE in
      config/mecha_comet_keyboard.conf. The legacy USB stack is deprecated in
      Zephyr main, so this is not sent upstream.
      Drop when ZMK moves to the new USB device stack, and call
      usbd_device_set_bcd_device() instead.

  - path: hal_nxp/0001-mcxc243-add-cmake-glue-and-pinctrl-header.patch
    sha256sum: 88d7a27bc2a723aa8d68035c4e7ba79622b38dba7bf98ff38818c179d1cc7760
    module: hal_nxp
    author: Shubham Patel
    email: shubhamp@ext.mechasystems.com
    date: 2026-10-19
    upstreamable: false
    apply-command: git apply
    comments: |
      MCXC243 CMake glue (copied from MCXC242) and the MCXC243VFT pinctrl header
      for the hal_nxp revision pinned by the ZMK Zephyr fork, which has the
      device headers but only stub CMake files.
      Drop when the Zephyr of ZMK pins a hal_nxp with MCXC243 support, as Zephyr
      main does (mcux-sdk-ng layout). That comes with the SoC patch, and the
      hal_nxp pin in west.yml follows it.
