# Firmware images built by CI, one per entry. "keymap" selects
# config/mecha_comet_keyboard_<keymap>.keymap (default: config/mecha_comet_keyboard.keymap), "conf"
# adds a file from config/ with -DEXTRA_CONF_FILE, and "check-only: true" builds the image without
# releasing it. The other keys are the ones ZMK uses: board, snippet, cmake-args, artifact-name.
---
include:
  - board: mecha_comet_keyboard//zmk
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mecha_comet_keyboard_qwerty_studio
  - board: mecha_comet_keyboard//zmk
    artifact-name: mecha_comet_keyboard_qwerty

  - board: mecha_comet_keyboard//zmk
    keymap: qwertz
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mecha_comet_keyboard_qwertz_studio
  - board: mecha_comet_keyboard//zmk
    keymap: qwertz
    artifact-name: mecha_comet_keyboard_qwertz

  - board: mecha_comet_keyboard//zmk
    keymap: azerty
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: mecha_comet_keyboard_azerty_studio
  - board: mecha_comet_keyboard//zmk
    keymap: azerty
    artifact-name: mecha_comet_keyboard_azerty

  # Development builds: only checked, never released.
  - board: mecha_comet_keyboard//zmk
    snippet: no-pivot-pip
    artifact-name: mecha_comet_keyboard_qwerty_no_pivot_pip
    check-only: true
  - board: mecha_comet_keyboard//zmk
    conf: debug.conf
    artifact-name: mecha_comet_keyboard_qwerty_debug
    check-only: true
  - board: mecha_comet_keyboard//zmk
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    conf: stack-analysis.conf
    artifact-name: mecha_comet_keyboard_qwerty_studio_stack_analysis
    check-only: true
